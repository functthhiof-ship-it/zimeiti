                      )}
                    </div>
                  </div>
                ) : (
                  <div className="flex-1 flex items-center justify-center text-zinc-500 text-sm">请在左侧选择或新建一个脚本</div>
                )}
              </div>
            )}

            {/* VIEW 3: COMPETITORS */}
            {activeTab === 'competitors' && (
              <div className="flex-1 overflow-y-auto p-8 max-w-7xl mx-auto w-full space-y-6">
                <div className="flex items-center justify-between">
                  <div>
                    <h2 className="text-xl font-bold tracking-tight text-white">对标账号库</h2>
                    <p className="text-xs text-zinc-400 mt-1">沉淀博主档案、赛道、赞粉比与核心能力打分。</p>
                  </div>
                  <div className="flex items-center space-x-2">
                    {['全部', '核心对标', '灵感参考', '次要对标', '避雷账号'].map(lvl => (
                      <button
                        key={lvl}
                        onClick={() => setCompetitorFilterLevel(lvl)}
                        className={`text-xs px-2.5 py-1 rounded transition ${
                          competitorFilterLevel === lvl ? 'bg-zinc-800 text-white font-medium' : 'text-zinc-400 hover:text-white'
                        }`}
                      >
                        {lvl}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                  {competitors
                    .filter(c => competitorFilterLevel === '全部' || c.level === competitorFilterLevel)
                    .map(comp => (
                      <div key={comp.id} className="bg-zinc-900/60 border border-zinc-800/80 rounded-xl p-5 space-y-3">
                        <div className="flex items-start justify-between">
                          <div>
                            <span className="font-bold text-white text-base mr-2">{comp.nickname}</span>
                            <span className="text-[10px] px-1.5 py-0.5 rounded bg-zinc-800 text-zinc-300 font-mono">{comp.platform}</span>
                            <div className="text-[11px] text-zinc-500 mt-1">{comp.folder}</div>
                          </div>
                          <span className="text-[10px] px-2 py-0.5 rounded bg-zinc-800 text-zinc-400">{comp.level}</span>
                        </div>
                        <div className="grid grid-cols-3 gap-2 bg-zinc-950/60 p-2 rounded-lg border border-zinc-800 text-center">
                          <div>
                            <div className="text-[10px] text-zinc-500">粉丝数</div>
                            <div className="text-xs font-bold text-white font-mono">{(comp.fans / 10000).toFixed(1)}w</div>
                          </div>
                          <div>
                            <div className="text-[10px] text-zinc-500">总获赞</div>
                            <div className="text-xs font-bold text-white font-mono">{(comp.totalLikes / 10000).toFixed(1)}w</div>
                          </div>
                          <div>
                            <div className="text-[10px] text-zinc-500">赞粉比</div>
                            <div className="text-xs font-bold text-emerald-400 font-mono">{comp.likeFanRatio}</div>
                          </div>
                        </div>
                        <p className="text-[11px] text-zinc-400 bg-zinc-900 p-2.5 rounded-lg border border-zinc-800/60">{comp.notes}</p>
                      </div>
                    ))}
                </div>
              </div>
            )}

            {/* VIEW 4: POSTS */}
            {activeTab === 'posts' && (
              <div className="flex-1 overflow-y-auto p-8 max-w-7xl mx-auto w-full space-y-6">
                <div className="flex items-center justify-between">
                  <div>
                    <h2 className="text-xl font-bold tracking-tight text-white">爆款拆解库</h2>
                    <p className="text-xs text-zinc-400 mt-1">保存对标视频数据、钩子拆解，并可由对标逆向查看已产出的脚本。</p>
                  </div>
                  <div className="flex items-center space-x-2">
                    {['全部', '钩子强', '低粉爆款', '适合口播', '适合画面参考'].map(tag => (
                      <button
                        key={tag}
                        onClick={() => setPostsFilterTag(tag)}
                        className={`text-xs px-2.5 py-1 rounded transition ${
                          postsFilterTag === tag ? 'bg-zinc-800 text-white font-medium' : 'text-zinc-400 hover:text-white'
                        }`}
                      >
                        {tag}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                  {posts
                    .filter(p => postsFilterTag === '全部' || p.tags?.includes(postsFilterTag))
                    .map(post => {
                      const comp = getCompetitor(post.competitorId);
                      const citedScripts = getScriptsCitingPost(post.id);
                      return (
                        <div key={post.id} className="bg-zinc-900/60 border border-zinc-800/80 rounded-xl overflow-hidden flex flex-col justify-between">
                          <div>
                            <div className="h-36 bg-zinc-800 relative">
                              <img src={post.cover} alt="" className="w-full h-full object-cover" />
                              <div className="absolute bottom-2 right-2 px-1.5 py-0.5 rounded bg-black/70 text-[10px] font-mono text-white">{post.duration}</div>
                              <div className="absolute top-2 left-2 px-2 py-0.5 rounded-full bg-black/60 backdrop-blur text-[10px] text-zinc-200">@{comp?.nickname}</div>
                            </div>
                            <div className="p-4 space-y-2">
                              <h3 className="font-semibold text-white text-sm line-clamp-2">{post.title}</h3>
                              <div className="bg-amber-500/10 border border-amber-500/20 rounded p-2 text-xs">
                                <span className="text-[10px] text-amber-400 block mb-0.5">🪝 钩子摘录:</span>
                                <p className="text-zinc-300 text-[11px] line-clamp-2">"{post.hookSnippet}"</p>
                              </div>
                            </div>
                          </div>

                          <div className="p-4 pt-0 space-y-3">
                            {citedScripts.length > 0 ? (
                              <div className="bg-emerald-950/30 border border-emerald-500/20 rounded p-2 text-[11px]">
                                <span className="text-emerald-400 font-medium block mb-0.5">已产出自制脚本 ({citedScripts.length}篇):</span>
                                {citedScripts.map(cs => (
                                  <div
                                    key={cs.id}
                                    onClick={() => { setSelectedScriptId(cs.id); setActiveTab('scripts'); }}
                                    className="text-zinc-300 hover:text-white truncate cursor-pointer underline"
                                  >
                                    → {cs.title}
                                  </div>
                                ))}
                              </div>
                            ) : (
                              <div className="text-[10px] text-zinc-500 py-1">暂未用来产出任何自制脚本</div>
                            )}

                            <div className="flex items-center space-x-2 pt-2 border-t border-zinc-800">
                              <button
                                onClick={() => setSelectedPostForBreakdown(post)}
                                className="flex-1 py-1.5 bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-xs font-medium rounded transition"
                              >
                                详细拆解
                              </button>
                              <button
                                onClick={() => handleSpawnScriptFromPost(post)}
                                className="flex-1 py-1.5 bg-emerald-500 hover:bg-emerald-400 text-black text-xs font-semibold rounded transition"
                              >
                                一键仿写
                              </button>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                </div>
              </div>
            )}

            {/* VIEW 5: SEARCH */}
            {activeTab === 'search' && (
              <div className="flex-1 overflow-y-auto p-8 max-w-4xl mx-auto w-full space-y-6">
                <div>
                  <h2 className="text-xl font-bold tracking-tight text-white">全局资料检索</h2>
                  <p className="text-xs text-zinc-400 mt-1">搜索脚本正文、对标博主名称、爆款视频标题与拆解。</p>
                </div>
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="搜索任意关键词，如：AI、开场钩子、带货、PPT..."
                  className="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white placeholder-zinc-500 outline-none focus:border-emerald-500"
                />
                {searchQuery.trim() !== '' && (
                  <div className="space-y-4">
                    {scripts
                      .filter(s => s.title.includes(searchQuery) || s.content.includes(searchQuery))
                      .map(s => (
                        <div
                          key={s.id}
                          onClick={() => { setSelectedScriptId(s.id); setActiveTab('scripts'); }}
                          className="p-3 bg-zinc-900 border border-zinc-800 rounded-lg hover:border-zinc-700 cursor-pointer"
                        >
                          <div className="text-xs font-bold text-emerald-400">【脚本】{s.title}</div>
                          <p className="text-[11px] text-zinc-400 line-clamp-2 mt-1">{s.content}</p>
                        </div>
                      ))}
                  </div>
                )}
              </div>
            )}

            {/* VIEW 6: BACKUP */}
            {activeTab === 'backup' && (
              <div className="flex-1 overflow-y-auto p-8 max-w-3xl mx-auto w-full space-y-6">
                <div>
                  <h2 className="text-xl font-bold tracking-tight text-white">数据备份与导出</h2>
                  <p className="text-xs text-zinc-400 mt-1">保存完整 JSON 快照文件到电脑本地，随时恢复。</p>
                </div>
                <div className="bg-zinc-900/60 border border-zinc-800 rounded-xl p-5 space-y-3">
                  <h3 className="text-sm font-semibold text-white">下载本地数据快照</h3>
                  <button
                    onClick={handleExportJSON}
                    className="bg-emerald-500 hover:bg-emerald-400 text-black font-semibold text-xs px-4 py-2 rounded-lg transition"
                  >
                    立即导出 JSON 备份
                  </button>
                </div>
                <div className="bg-zinc-900/60 border border-zinc-800 rounded-xl p-5 space-y-3">
                  <h3 className="text-sm font-semibold text-white">导入恢复数据</h3>
                  <label className="inline-flex items-center space-x-1.5 bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-xs px-4 py-2 rounded-lg cursor-pointer transition">
                    <span>选择备份文件恢复</span>
                    <input type="file" accept=".json" onChange={handleImportJSON} className="hidden" />
                  </label>
                </div>
              </div>
            )}
          </main>

          {/* 拆解模态窗 */}
          {selectedPostForBreakdown && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-zinc-900 border border-zinc-800 rounded-2xl w-full max-w-3xl max-h-[90vh] flex flex-col overflow-hidden shadow-2xl">
                <div className="p-4 border-b border-zinc-800 flex items-center justify-between">
                  <h3 className="font-bold text-white text-sm truncate mr-4">{selectedPostForBreakdown.title}</h3>
                  <button onClick={() => setSelectedPostForBreakdown(null)} className="p-1 text-zinc-400 hover:text-white">✕</button>
                </div>
                <div className="p-6 overflow-y-auto space-y-4 text-xs">
                  <div className="bg-amber-500/10 border border-amber-500/20 rounded-xl p-4">
                    <span className="text-xs font-bold text-amber-400 block mb-1">🔥 黄金吸睛钩子 (前3-5秒)</span>
                    <p className="text-zinc-100 text-sm">"{selectedPostForBreakdown.hookSnippet}"</p>
                  </div>
                  <div>
                    <span className="text-xs font-semibold text-zinc-300">📐 叙事结构骨架</span>
                    <div className="bg-zinc-950 p-3 rounded-lg border border-zinc-800 text-zinc-300 font-mono mt-1">
                      {selectedPostForBreakdown.structure}
                    </div>
                  </div>
                  <div>
                    <span className="text-xs font-semibold text-zinc-300">📝 视频逐字稿 (AI转录)</span>
                    <div className="bg-zinc-950 p-3 rounded-lg border border-zinc-800 text-zinc-300 whitespace-pre-wrap mt-1 max-h-48 overflow-y-auto">
                      {selectedPostForBreakdown.transcript}
                    </div>
                  </div>
                </div>
                <div className="p-4 border-t border-zinc-800 flex items-center justify-end space-x-3">
                  <button onClick={() => setSelectedPostForBreakdown(null)} className="px-4 py-2 bg-zinc-800 text-zinc-300 text-xs rounded-lg">关闭</button>
                  <button
                    onClick={() => {
                      const post = selectedPostForBreakdown;
                      setSelectedPostForBreakdown(null);
                      handleSpawnScriptFromPost(post);
                    }}
                    className="px-4 py-2 bg-emerald-500 text-black font-semibold text-xs rounded-lg"
                  >
                    以该视频为底稿一键仿写
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
